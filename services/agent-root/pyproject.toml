[project]
name = "src"
version = "0.0.1"
description = "An ADK A2A Root Agent running on Agent Engine"
authors = [
    {name = "change_me", email = "change_me@example.com"},
]
license = {text = "APACHE-2.0"}
requires-python = ">=3.10"
dependencies = [
    # Custom Dependencies
    "common_gcp @ git+ssh://git@gitlab.com/google-cloud-ce/communities/Starter-Packs/field-solutions-arch-building-blocks/shared-libraries/python/common_gcp.git@latest",
    "common_logging @ git+ssh://git@gitlab.com/google-cloud-ce/communities/Starter-Packs/field-solutions-arch-building-blocks/shared-libraries/python/common_logging.git@latest",
    "safety_plugins @ git+ssh://git@github.com/google/adk-samples.git@main#subdirectory=python/agents/safety-plugins",
    # ADK Dependencies
    # Core Google Cloud dependencies
    "google-cloud-aiplatform[adk,agent_engines]>=1.110.0",
    "google-adk[a2a]>=1.17.0",
    "google-api-core>=2.24.2",
    "google-auth>=2.40.2",
    "google-cloud-storage>=2.19.0",
    "google-cloud-logging>=3.12.1",
    "google-cloud-trace>=1.16.1",
    "google-cloud-firestore>=2.21.0",
    "google-genai>=1.36.0",
    # Core dependencies
    "uuid>=1.30",
    "python-dotenv>=1.0.0",
    "cloudpickle>=3.1.1",
    "requests>=2.32.3",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "httpx>=0.28.1",
    "aiohttp>=3.12.6",
    # Utilities
    "PyYAML>=6.0.2",
    "toml>=0.10.2",
    # Phoenix OTEL
    "arize-phoenix>=12.8.0",
    "openinference-instrumentation-google-adk>=0.1.6",
    "arize-phoenix-otel>=0.13.1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.10.6,<8.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-asyncio>=0.25.3,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.9.9",
    "httpx>=0.28.1",
    "pre-commit>=4.3.0",
    "python-dotenv>=1.1.1",
    "bandit",
    "pip-audit"
]

docs = [
    "sphinx>=8.2.3,<9.0.0",
    "sphinx-reports>=0.9.7,<1.0.0",
    "sphinx-test-reports>=1.2.0,<2.0.0",
    "sphinxcontrib-plantuml>=0.31,<1.0",
    "sphinx-markdown-builder>=0.6.8",
    "toml>=0.10.2",
]

deploy = [
    "python-dotenv>=1.1.1",
    "toml>=0.10.2",
    "google-cloud-aiplatform[adk,agent_engines]>=1.110.0",
    "google-cloud-logging>=3.12.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ADK Plugin classes for Local Dev, Test, and Live Agent Engine instances
[tool.agent.plugins]
dev = [
    # Uncomment to enable Model Armor for local dev testing.
    #"utils.model_armor.ModelArmorSafetyFilterPlugin"
]
test = [
    # Uncomment to enable Model Armor for unit testing.
    #"utils.model_armor.ModelArmorSafetyFilterPlugin"
]
live = [
    # Uncomment to enable Model Armor for agent engine runtime.
    #"utils.model_armor.ModelArmorSafetyFilterPlugin"
]
