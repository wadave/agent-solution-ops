[dependency-groups]
dev = [
  "ipykernel>=7.0.1",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0"
]

[project]
name = "adk-mcp-oauth"
version = "0.1.0"
description = "ADK agent with dual-mode OAuth authentication for secured MCP services on Google Cloud"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-starter-pack>=0.38.0",
  "fastapi>=0.132.0",
  "google-adk[eval]>=1.18",
  "google-auth>=2.41.1",
  "google-auth-oauthlib>=1.2.2",
  "google-cloud-aiplatform>=1.138.0",
  "google-cloud-logging>=3.13.0",
  "google-genai>=1.43.0",
  "pre-commit>=4.5.1",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1"
]

[project.optional-dependencies]
lint = [
  "codespell>=2.4.1",
  "ruff>=0.15.2",
  "ty>=0.0.18"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 (line-too-long) is handled by the formatter for code; long strings,
# HTML templates and URLs inside literals cannot be auto-wrapped.
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
