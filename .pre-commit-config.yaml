repos:
  - repo: local
    hooks:
      - id: make-tests
        name: Run make tests
        entry: bash -c 'export LC_ALL=C.UTF-8 && make tests'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: make-lint
        name: Run make lint
        entry: bash -c 'export LC_ALL=C.UTF-8 && make lint'
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-make
        name: Check for make
        entry: bash -c 'command -v make >/dev/null 2>&1 || (echo "make is required" && exit 1)'
        language: system
        pass_filenames: false
