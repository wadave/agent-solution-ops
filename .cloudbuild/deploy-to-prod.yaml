steps:
  - name: "python:3.12-slim"
    id: install-dependencies
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        pip install uv==0.8.13 --user && uv sync --locked --no-dev
    env:
      - 'PATH=/usr/local/bin:/usr/bin:~/.local/bin'

  - name: "gcr.io/cloud-builders/docker"
    id: build-mcp-server
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROD_PROJECT_ID}/mcp-server-repo/weather-mcp-server:${COMMIT_SHA}"
      - "./src/mcp_servers/weather_mcp_server"

  - name: "gcr.io/cloud-builders/docker"
    id: push-mcp-server
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${_PROD_PROJECT_ID}/mcp-server-repo/weather-mcp-server:${COMMIT_SHA}"

  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine'
    id: terraform-apply
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        apk add --no-cache unzip wget
        wget -q https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip terraform_1.5.7_linux_amd64.zip
        mv terraform /usr/local/bin/
        cd deployment/terraform
        terraform init
        terraform apply -auto-approve -refresh=false \
          -target='google_project_iam_member.cicd_project_roles' \
          -target='google_artifact_registry_repository.mcp_repo["prod"]' \
          -target='google_cloud_run_v2_service.mcp_server["prod"]' \
          -target='google_cloud_run_v2_service_iam_binding.mcp_server_public_access["prod"]' \
          -target='google_vertex_ai_reasoning_engine.app["prod"]'
    env:
      - 'TF_VAR_region=${_REGION}'
      - 'TF_VAR_prod_project_id=${_PROD_PROJECT_ID}'
      - 'TF_VAR_staging_project_id=${_STAGING_PROJECT_ID}'
      - 'TF_VAR_cicd_runner_project_id=${_CICD_RUNNER_PROJECT_ID}'
      - 'TF_VAR_host_connection_name=${_HOST_CONNECTION_NAME}'
      - 'TF_VAR_staging_connection_name=${_STAGING_CONNECTION_NAME}'
      - 'TF_VAR_repository_name=${_REPOSITORY_NAME}'
      - 'TF_VAR_repository_owner=${_REPOSITORY_OWNER}'
      - 'TF_VAR_ge_app_staging=${_GE_APP_STAGING}'
      - 'TF_VAR_ge_app_prod=${_GE_APP_PROD}'
      - 'TF_VAR_oauth_client_id_secret_name=${_OAUTH_CLIENT_ID_SECRET_NAME}'

  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine'
    id: deploy-mcp-server
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy weather-mcp-server-oauth-prod \
          --image=${_REGION}-docker.pkg.dev/${_PROD_PROJECT_ID}/mcp-server-repo/weather-mcp-server:${COMMIT_SHA} \
          --region=${_REGION} \
          --project=${_PROD_PROJECT_ID}
    waitFor: ['terraform-apply', 'push-mcp-server']

  # Read the Cloud Run MCP URL from Terraform output (avoids a separate gcloud call).
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine'
    id: get-mcp-url
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        apk add --no-cache unzip wget
        wget -q https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip terraform_1.5.7_linux_amd64.zip
        mv terraform /usr/local/bin/
        cd deployment/terraform
        terraform init -reconfigure
        MCP_URL=$$(terraform output -raw mcp_url_prod)
        echo "$${MCP_URL}" > /workspace/mcp_url.txt
        echo "MCP URL: $${MCP_URL}"
    env:
      - 'TF_VAR_region=${_REGION}'
      - 'TF_VAR_prod_project_id=${_PROD_PROJECT_ID}'
      - 'TF_VAR_staging_project_id=${_STAGING_PROJECT_ID}'
      - 'TF_VAR_cicd_runner_project_id=${_CICD_RUNNER_PROJECT_ID}'
      - 'TF_VAR_host_connection_name=${_HOST_CONNECTION_NAME}'
      - 'TF_VAR_staging_connection_name=${_STAGING_CONNECTION_NAME}'
      - 'TF_VAR_repository_name=${_REPOSITORY_NAME}'
      - 'TF_VAR_repository_owner=${_REPOSITORY_OWNER}'
      - 'TF_VAR_ge_app_staging=${_GE_APP_STAGING}'
      - 'TF_VAR_ge_app_prod=${_GE_APP_PROD}'
      - 'TF_VAR_oauth_client_id_secret_name=${_OAUTH_CLIENT_ID_SECRET_NAME}'
    waitFor: ['terraform-apply']

  - name: "python:3.12-slim"
    id: deploy-adk-agent
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export MCP_URL=$(cat /workspace/mcp_url.txt)
        uv export --no-hashes --no-sources --no-header --no-dev --no-emit-project --no-annotate --locked > /workspace/requirements.txt
        uv run python deployment/deploy_agents.py
    env:
      - 'PATH=/usr/local/bin:/usr/bin:~/.local/bin'
      - 'PYTHONPATH=src'
      - 'PROJECT_ID=${_PROD_PROJECT_ID}'
      - 'GOOGLE_CLOUD_REGION=${_REGION}'
      - 'APP_SERVICE_ACCOUNT=${_APP_SERVICE_ACCOUNT_PROD}'
      - 'AUTH_ID=${_AUTH_ID_PROD}'
      - 'DISPLAY_NAME_SUFFIX=Prod'
      - 'REQUIREMENTS_FILE=/workspace/requirements.txt'
      - 'BUCKET_NAME=${_PROD_PROJECT_ID}-bucket'
      - 'GEMINI_MODEL=${_GEMINI_MODEL}'
      - 'RETRY_ATTEMPTS=${_RETRY_ATTEMPTS}'
      - 'MCP_TIMEOUT=${_MCP_TIMEOUT}'
    waitFor: ['get-mcp-url', 'install-dependencies']

  # Register the Agent Engine with Gemini Enterprise after deployment so the
  # registration script can find the (now-existing) agent by display name.
  # Uses the gcloud image so that `gcloud auth print-access-token` is available
  # inside the Terraform null_resource local-exec provisioner.
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine'
    id: 'register-agent'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        apk add --no-cache jq unzip wget
        wget -q https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip terraform_1.5.7_linux_amd64.zip
        mv terraform /usr/local/bin/
        cd deployment/terraform
        terraform init
        terraform apply -auto-approve -refresh=false \
          -target='module.gemini_enterprise_oauth["prod"]' \
          -target='module.gemini_enterprise_agent_engine_register["prod"]'
    env:
      - 'TF_VAR_region=${_REGION}'
      - 'TF_VAR_prod_project_id=${_PROD_PROJECT_ID}'
      - 'TF_VAR_staging_project_id=${_STAGING_PROJECT_ID}'
      - 'TF_VAR_cicd_runner_project_id=${_CICD_RUNNER_PROJECT_ID}'
      - 'TF_VAR_host_connection_name=${_HOST_CONNECTION_NAME}'
      - 'TF_VAR_staging_connection_name=${_STAGING_CONNECTION_NAME}'
      - 'TF_VAR_repository_name=${_REPOSITORY_NAME}'
      - 'TF_VAR_repository_owner=${_REPOSITORY_OWNER}'
      - 'TF_VAR_ge_app_staging=${_GE_APP_STAGING}'
      - 'TF_VAR_ge_app_prod=${_GE_APP_PROD}'
      - 'TF_VAR_oauth_client_id_secret_name=${_OAUTH_CLIENT_ID_SECRET_NAME}'
    waitFor: ['deploy-adk-agent']


# All substitution values are injected by the Cloud Build trigger defined in
# deployment/terraform/build_triggers.tf — no defaults are set here.

logsBucket: gs://${PROJECT_ID}-agents-solution-ops-logs/build-logs
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
